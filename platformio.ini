; mqtt library added just to test mqtt protocol

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	adafruit/Adafruit MQTT Library@^2.6.1
	adafruit/Adafruit IO Arduino@^4.3.3
